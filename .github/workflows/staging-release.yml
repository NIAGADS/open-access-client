# Builds all packages and publishes canary versions to npm

name: Staging Release

on:
  pull_request:
    branches:
      - main
    types: 
      - closed

permissions:
  id-token: write # for OIDC for npm trusted publishers
  contents: read

jobs:
  publish-canary:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
      - name: update to latest npm for oidc support
        run: npm install -g npm@latest
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Create synthetic PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          SYNTHETIC_SHA=$(
            git commit-tree HEAD^{tree} \
              -p "$BASE_SHA" \
              -m "Temporary canary commit for PR #${{ github.event.pull_request.number }}"
          )
          git checkout --detach "$SYNTHETIC_SHA"
      - name: Install dependencies
        run: npm ci
      - name: Build packages 
        run: npm run build
      - name: Publish canary
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npx lerna publish --canary --yes --dist-tag canary

  adsp-staging-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: build image and push to ECR
        run: ./scripts/build-docker.sh adsp staging
      - name: Pull and run image on staging server via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy adsp staging site" \
            --parameters commands="sudo /opt/oa-deploy/deploy.sh adsp "staging-v$GITHUB_RUN_NUMBER" \
            --query Command.CommandId --output text)
          echo "SSM CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          get(){ aws ssm get-command-invocation --region "$AWS_REGION" \
                   --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "$1" --output text; }
          echo "----- deploy.sh stdout -----"; get StandardOutputContent
          echo "----- deploy.sh stderr -----"; get StandardErrorContent
          STATUS=$(get Status)
          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ] || { echo "::error::deploy failed on host (status=$STATUS)"; exit 1; }
